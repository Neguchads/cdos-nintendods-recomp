plugins {
    id 'com.android.application'
}

android {
    namespace 'com.castlevaniados.recomp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.castlevaniados.recomp'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DNDS_SDL_BACKEND=SDL3',
                          '-DNDS_3D_GEOMETRY=NATIVE',
                          '-DNDS_ENABLE_COMPUTE_RENDERER=ON',
                          '-DNDS_BOOTSTRAP_FIRMWARE=ON',
                          '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1+'
        }
    }
}
