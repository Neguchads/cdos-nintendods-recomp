name: AutoVerify published release (manual pilot)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag (vX.Y.Z)
        required: true
        type: string
      asset_name:
        description: Exact public release asset basename
        required: true
        type: string
      expected_sha256:
        description: Independently verified lowercase release SHA-256
        required: true
        type: string
      lookup_public_noncommercial:
        description: Confirm non-commercial authorized public hash lookup under VirusTotal terms
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: navi-autoverify-public
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate scope and inputs
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          PRIVATE: ${{ github.event.repository.private }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
          EXPECTED: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          [[ "$REPO" == "Neguchads/cdos-nintendods-recomp" ]]
          [[ "$REF" == "refs/heads/main" && "$PRIVATE" == "false" ]]
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){2}(-[A-Za-z0-9.-]+)?$ ]]
          [[ "$ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select published asset by exact metadata and digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
          EXPECTED: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/navi-release"
          gh api "repos/Neguchads/cdos-nintendods-recomp/releases/tags/$TAG" > "$RUNNER_TEMP/navi-release/metadata.json"
          python3 -I tools/autoverify_release.py "$RUNNER_TEMP/navi-release/metadata.json" "$TAG" "$ASSET" "$EXPECTED" > "$RUNNER_TEMP/navi-release/selection.json"
          gh release download "$TAG" --repo Neguchads/cdos-nintendods-recomp --pattern "$ASSET" --output "$RUNNER_TEMP/navi-release/artifact"
      - name: Check exact downloaded bytes
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected_sha256 }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/navi-release"
          [[ -f artifact && ! -L artifact ]]
          [[ "$(stat -c%s artifact)" == "$(jq -r .size_bytes selection.json)" ]]
          printf '%s  artifact\n' "$EXPECTED" | sha256sum --check --strict
          mv -- artifact "$ASSET"
          jq '. + {status:"local-hash-verified",scope:"integrity only; not malware scan or build attestation"}' selection.json > integrity.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.lookup_public_noncommercial
        with:
          repository: Neguchads/navi-core
          ref: 24d3cf694217a9fe9ebb8a65466fef423bdfb69a
          path: reviewed-core
          persist-credentials: false
      - name: Explicit public non-commercial VirusTotal lookup
        if: inputs.lookup_public_noncommercial
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          EXPECTED: ${{ inputs.expected_sha256 }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          python3 -I reviewed-core/navi_core/autoverify.py "$RUNNER_TEMP/navi-release/$ASSET" --expected-sha256 "$EXPECTED" --lookup-public-noncommercial > "$RUNNER_TEMP/navi-release/virustotal.json"
      - name: Keep only verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: autoverify-release-report
          path: |
            ${{ runner.temp }}/navi-release/integrity.json
            ${{ runner.temp }}/navi-release/virustotal.json
          if-no-files-found: warn
          retention-days: 7
